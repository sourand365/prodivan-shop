name: MotoConnect Android APK

on:
  pull_request:
    paths:
      - "MotoConnect/Android/flutter_app/**"
      - ".github/workflows/motoconnect-android.yml"
  push:
    branches:
      - "fix/motoconnect-group-dialog-lifecycle"
      - "feat/motoconnect-voice-ui"
      - "feat/motoconnect-auth-presence"
    paths:
      - "MotoConnect/Android/flutter_app/**"
      - ".github/workflows/motoconnect-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MotoConnect/Android/flutter_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        run: flutter create --platforms=android --project-name moto_connect .

      - name: Verify Flutter installation
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run widget tests
        run: flutter test

      - name: Configure Google Maps key
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if manifest.exists():
              text = manifest.read_text()
              text = text.replace("__MAPS_API_KEY__", os.environ.get("MAPS_API_KEY", ""))
              manifest.write_text(text)
          PY

      - name: Build debug APK
        env:
          MOTOCONNECT_API_URL: ${{ secrets.MOTOCONNECT_API_URL }}
        run: flutter build apk --debug --dart-define=MOTOCONNECT_API_URL="$MOTOCONNECT_API_URL"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MotoConnect-debug-apk
          path: MotoConnect/Android/flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
