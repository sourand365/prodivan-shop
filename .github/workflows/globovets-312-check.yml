name: Globovets 3.1.2 syntax check

on:
  push:
    branches: [main]
    paths:
      - 'Глобовец 3.1.2/**'
      - '.github/workflows/globovets-312-check.yml'
  pull_request:
    paths:
      - 'Глобовец 3.1.2/**'
      - '.github/workflows/globovets-312-check.yml'

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: npm --prefix 'Глобовец 3.1.2' run check
