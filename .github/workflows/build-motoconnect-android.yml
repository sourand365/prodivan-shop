name: MotoConnect Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "MotoConnect/Android/flutter_app/**"
      - ".github/workflows/build-motoconnect-android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MotoConnect/Android/flutter_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create --platforms=android --project-name moto_connect .
      - name: Configure Google Maps SDK and API key
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          key = os.environ.get("MAPS_API_KEY", "").strip()
          if not key:
              raise SystemExit("Missing GitHub Actions secret: MAPS_API_KEY")

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          nl = chr(10)
          if "ACCESS_COARSE_LOCATION" not in text:
              insertion = (
                  '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' + nl
                  + '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />' + nl
                  + '    <application'
              )
              text = text.replace('    <application', insertion, 1)
          lines = [line for line in text.splitlines()
                   if "com.google.android.geo.API_KEY" not in line]
          text = nl.join(lines)
          metadata = f'        <meta-data android:name="com.google.android.geo.API_KEY" android:value="{key}" />'
          text = text.replace('    <application', '    <application' + nl + metadata, 1)
          ET.fromstring(text)
          manifest.write_text(text)
          PY
      - name: Install packages
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: moto-connect-android-debug
          path: MotoConnect/Android/flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
