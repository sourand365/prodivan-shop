name: MotoConnect Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "MotoConnect/Android/flutter_app/**"
      - ".github/workflows/build-motoconnect-android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MotoConnect/Android/flutter_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create --platforms=android --project-name moto_connect .
      - name: Configure Google Maps SDK and API key
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          key = os.environ.get("MAPS_API_KEY", "").strip()
          if not key:
              raise SystemExit("Missing GitHub Actions secret: MAPS_API_KEY")

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          android_ns = "http://schemas.android.com/apk/res/android"
          ET.register_namespace("android", android_ns)
          android_name = f"{{{android_ns}}}name"
          android_value = f"{{{android_ns}}}value"

          tree = ET.parse(manifest)
          root = tree.getroot()

          required_permissions = (
              "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.ACCESS_FINE_LOCATION",
          )
          for permission in required_permissions:
              exists = any(
                  node.tag == "uses-permission"
                  and node.get(android_name) == permission
                  for node in root.findall("uses-permission")
              )
              if not exists:
                  node = ET.Element("uses-permission")
                  node.set(android_name, permission)
                  application = root.find("application")
                  if application is not None:
                      root.insert(list(root).index(application), node)
                  else:
                      root.append(node)

          application = root.find("application")
          if application is None:
              raise SystemExit("AndroidManifest.xml has no <application> element")

          # Replace any existing Maps key entry; ElementTree safely XML-escapes the key.
          for node in list(application.findall("meta-data")):
              if node.get(android_name) == "com.google.android.geo.API_KEY":
                  application.remove(node)

          metadata = ET.SubElement(application, "meta-data")
          metadata.set(android_name, "com.google.android.geo.API_KEY")
          metadata.set(android_value, key)

          ET.indent(tree, space="    ")
          tree.write(manifest, encoding="utf-8", xml_declaration=True)

          # Parse the written file again so malformed output fails before Flutter build.
          ET.parse(manifest)
          PY
      - name: Install packages
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Build debug APK
        env:
          MOTOCONNECT_API_URL: ${{ secrets.MOTOCONNECT_API_URL }}
        run: flutter build apk --debug --dart-define=MOTOCONNECT_API_URL="$MOTOCONNECT_API_URL"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: moto-connect-android-debug
          path: MotoConnect/Android/flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
